<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .register-card {
      max-width: 480px;
      border: none;
      border-radius: 12px;
      background: #ffffff;
    }

    .form-control,
    .form-check-input {
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
    }

    .form-control:focus {
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
    }

    .btn-primary {
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      padding: 0.6rem;
      font-weight: 500;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.875rem;
      color: #333;
      margin-bottom: 0.35rem;
    }

    /* Style cho dòng thông báo lỗi */
    .error-msg {
      font-size: 0.8rem;
      color: #dc3545;
      display: block;
      margin-top: 0.25rem;
    }
  </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="card register-card w-100 p-4 p-md-5">
    <div class="card-body p-0">

      <!-- Header -->
      <div class="text-center mb-4">
        <h2 class="fw-bold mb-2" style="color: #111827;">Đăng ký tài khoản</h2>
        <p class="text-muted small">Đăng ký tài khoản để sử dụng dịch vụ</p>
      </div>

      <!-- Thông báo đăng ký thành công -->
      <div id="success-message" class="alert alert-success d-none" role="alert">
        Đăng ký tài khoản thành công!
      </div>

      <!-- Form -->
      <form id="registerForm">
        <!-- First Name & Last Name -->
        <div class="row g-3 mb-3">
          <div class="col-7">
            <label for="first_name" class="form-label">Họ và tên đệm</label>
            <input type="text" class="form-control" id="first_name" name="first_name">
            <small id="first_name_err" class="error-msg"></small>
          </div>
          <div class="col-5">
            <label for="last_name" class="form-label">Tên</label>
            <input type="text" class="form-control" id="last_name" name="last_name">
            <small id="last_name_err" class="error-msg"></small>
          </div>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="text" class="form-control" id="email" name="email" placeholder="you@company.com">
          <small id="email_err" class="error-msg"></small>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label">Mật khẩu</label>
          <input type="password" class="form-control" id="password" name="password">
          <small id="password_err" class="error-msg"></small>
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
          <label for="confirm_password" class="form-label">Xác nhận mật khẩu</label>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password">
          <small id="confirm_password_err" class="error-msg"></small>
        </div>

        <!-- Terms Agreement Checkbox -->
        <div class="mb-4 mt-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="terms" name="terms">
            <label class="form-check-label small text-muted ms-1" for="terms">
              Bạn đồng ý với <a href="#" class="text-decoration-none text-primary fw-medium">chính sách và điều
                khoản</a>
            </label>
          </div>
          <small id="agree_err" class="error-msg"></small>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100 fw-bold">Đăng ký</button>

        <!-- Login Link -->
        <div class="text-center mt-4">
          <span class="small text-muted">Bạn đã có tài khoản? </span>
          <a href="login.html" class="small text-decoration-none text-primary fw-medium">Đăng nhập</a>
        </div>
      </form>

    </div>
  </div>
  <script src="./data.js"></script>
  <script src="register.js"></script>
</body>

</html>
