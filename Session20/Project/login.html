<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .login-card {
      max-width: 480px;
      border: none;
      border-radius: 12px;
      background: #ffffff;
    }

    .form-control,
    .form-check-input {
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
    }

    .form-control:focus {
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
    }

    .btn-primary {
      background-color: #2563eb;
      border: none;
      border-radius: 8px;
      padding: 0.6rem;
      font-weight: 500;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.875rem;
      color: #333;
      margin-bottom: 0.35rem;
    }

    .error-msg {
      font-size: 0.8rem;
      color: #dc3545;
      display: block;
      margin-top: 0.25rem;
    }
  </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="card login-card w-100 p-4 p-md-5">
    <div class="card-body p-0">

      <!-- Header -->
      <div class="text-center mb-4">
        <h2 class="fw-bold mb-2" style="color: #111827;">Đăng nhập</h2>
        <p class="text-muted small">Đăng nhập tài khoản để sử dụng hệ thống quản lý.</p>
      </div>

      <!-- Thông báo đăng nhập thành công -->
      <div id="successAlert" class="alert alert-success d-none" role="alert">
        Đăng nhập thành công! Đang chuyển đến trang quản lý...
      </div>

      <!-- Alert hiển thị khi thông tin tài khoản hoặc mật khẩu không đúng -->
      <div id="authAlert" class="alert alert-danger d-none" role="alert">
        Email hoặc Mật khẩu không đúng!
      </div>

      <!-- Form Đăng nhập -->
      <form id="loginForm">
        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" autocomplete="email">
          <small id="email_err" class="error-msg"></small>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label">Mật khẩu</label>
          <input type="password" class="form-control" id="password" name="password" autocomplete="current-password">
          <small id="password_err" class="error-msg"></small>
        </div>

        <!-- Checkbox Remember & Forgot Password -->
        <div class="d-flex justify-content-between align-items-center mb-4 mt-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label small text-muted ms-1" for="remember">
              Nhớ tài khoản
            </label>
          </div>
          <a href="#" class="small text-decoration-none text-primary fw-medium">Quên mật khẩu?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100 fw-bold">Đăng nhập</button>

        <!-- Register Link -->
        <div class="text-center mt-4">
          <span class="small text-muted">Bạn chưa có tài khoản? </span>
          <a href="register.html" class="small text-decoration-none text-primary fw-medium">Đăng ký</a>
        </div>
      </form>

    </div>
  </div>
  <script src="./data.js"></script>
  <script src="login.js"></script>
</body>

</html>
